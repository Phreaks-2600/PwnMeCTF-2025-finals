{% extends 'base.html' %}

{% block title %}Open Chests{% endblock %}

{% block content %}
{% include 'navbar.html' %}

<div x-data="fullScreen()" class="relative">
    <!-- Fullscreen Button -->
    <button @click="toogle" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded shadow-md z-50">
        <i :class="fullscreen ? 'fas fa-compress' : 'fas fa-expand'"></i>
    </button>
</div>

<div x-data="chestApp()">
    <div id="fullscreen-container" class="flex items-center justify-center min-h-screen -mt-16">
        <div class="container mx-auto">
            <h1 class="text-6xl font-extrabold text-center text-indigo-600 mb-12">Unlock Your Treasure!</h1>
            <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 shadow-2xl rounded-2xl p-12 max-w-2xl mx-auto text-white">
                <p class="text-2xl mb-8 text-center">Each chest costs <span class="font-bold">$100</span>. Choose wisely!</p>
                <div class="space-y-8">
                    <div class="flex items-center justify-center space-x-6">
                        <label for="chest-count" class="text-2xl font-medium">Select:</label>
                        <select id="chest-count" x-model="chestCount" class="block w-40 text-center text-xl border-4 border-yellow-400 rounded-full shadow-lg text-black transition-transform transform hover:scale-110">
                            <template x-for="n in 3" :key="n">
                                <option :value="n" x-text="n + ' Chest' + (n > 1 ? 's' : '')"></option>
                            </template>
                        </select>
                    </div>
                    <p class="text-center text-2xl">Total cost: <span class="font-bold">$<span x-text="chestCount * 100"></span></span></p>
                    <div class="flex justify-center">
                        <button class="bg-yellow-400 hover:bg-yellow-500 text-black font-bold py-4 px-8 rounded-full shadow-2xl transform hover:scale-110 transition-transform duration-200"
                            @click="openChests">
                            <span class="flex items-center space-x-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h11M9 21V3m0 0L3 10m6-7l6 7" />
                                </svg>
                                <span>Open Chest(s)</span>
                            </span>
                        </button>
                    </div>
                    <div x-show="errorMessage" class="text-red-800 font-bold text-center py-2 px-4 rounded mb-4 text-lg">
                        <span x-text="errorMessage"></span>
                    </div>
                    <div x-show="items.length > 0" class="mt-8">
                        <h2 class="text-2xl font-bold text-center mb-4">Items Obtained:</h2>
                        <ul class="list-disc list-inside text-lg">
                            <template x-for="item in items">
                                <li>
                                    <span x-text="item.name"></span> - 
                                    <span x-text="item.rarity" class="italic"></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="mt-12 text-center">
                <p class="text-xl text-gray-500">Feeling lucky? Try your chance and unlock amazing rewards!</p>
            </div>
        </div>
    </div>
</div>

<script>

function fullScreen(){
    return {
        fullscreen: false,
        toogle() {
            const fullscreenContainer = document.getElementById('fullscreen-container');

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenContainer.classList.remove('-mt-16');
                fullscreenContainer.scrollIntoView({ behavior: 'smooth' });
                this.fullscreen = true;
            } else {
                fullscreenContainer.classList.add('-mt-16');
                document.exitFullscreen();
                this.fullscreen = false;
            }
        }
    }
}

function chestApp() {
    return {
        chestCount: 1,
        items: [],
        errorMessage: '',
        
        async openChests() {
            this.errorMessage = ''; // Reset error message
            try {
                const response = await fetch('/api/drop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nb: parseInt(this.chestCount) })
                });

                const data = await response.json();

                if (!response.ok) {
                    this.errorMessage = data.error || 'An unknown error occurred.';
                    return;
                }

                this.items = data.items;
            } catch (error) {
                console.error('Error:', error);
                this.errorMessage = 'Failed to open chests. Please try again.';
            }
        }
    };
}
</script>
{% endblock %}

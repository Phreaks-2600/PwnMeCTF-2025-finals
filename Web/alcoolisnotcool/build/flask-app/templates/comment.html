<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Comment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black">
    <header class="bg-[#0055A4] py-6 shadow-lg">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl font-bold text-center text-white">Leave a Comment</h1>
        </div>
    </header>
    <section class="py-16 bg-gradient-to-r from-[#0055A4] to-[#FFD700]">
        <div class="container mx-auto px-6">
            <form action="/comment" method="POST" class="bg-white p-6 rounded-lg shadow-lg">
                <label for="url" class="block text-lg text-[#0055A4] mb-2">Enter a URL:</label>
                <input type="text" id="url" name="url" placeholder="https://pastebin.com/raw/..." class="w-full p-2 border border-[#0055A4] rounded-lg mb-4">
                <button type="submit" class="bg-[#FFD700] hover:bg-[#FFC800] text-[#0055A4] px-6 py-2 rounded-lg transition duration-300">Submit</button>
            </form>
        </div>
    </section>
    <footer class="bg-[#0055A4] py-8">
        <div class="container mx-auto px-6 text-center">
            <p class="text-lg text-white">© 2025 Bar P4st1s. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
